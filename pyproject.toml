[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "investment-monitor"
version = "0.1.0"
description = "Automated monitor for infrastructure investment announcements (Kompas Inwestycji + TED EU)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "browser-cookie3>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
investment-monitor = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
